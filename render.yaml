services:
  - type: web
    name: ai-khata-staging-backend
    env: docker
    region: frankfurt
    plan: free
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      
      # Generated Secrets
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      
      # Required Staging Infrastructure (Provided in Render Dashboard)
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      
      # Sandbox Third-Party Credentials (Provided in Render Dashboard)
      - key: RAAST_API_KEY
        sync: false
      - key: RAAST_WEBHOOK_SECRET
        sync: false
      
      # AI & Comm (Mocking for staging to save costs unless overridden in dashboard)
      - key: AI_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_API_KEY
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: SMS_PROVIDER_KEY
        sync: false
