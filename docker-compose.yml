version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: khata_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=ai_khata_saas
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: khata_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
